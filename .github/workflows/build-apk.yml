name: Build AURIX APK

on:
  workflow_dispatch:

  push:
    paths:
      - "AURIX-Android-Release-v1-SDK-GRADLE.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. CHECK ZIP
      # ============================================================

      - name: Check AURIX archive
        shell: bash
        run: |
          set -e

          echo "Checking AURIX archive..."

          if [ ! -f "AURIX-Android-Release-v1-SDK-GRADLE.zip" ]; then
            echo "ERROR: AURIX Android ZIP not found."
            echo
            echo "Repository files:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          ls -lh "AURIX-Android-Release-v1-SDK-GRADLE.zip"

          echo "Archive found."


      # ============================================================
      # 3. UNPACK
      # ============================================================

      - name: Unpack AURIX project
        shell: bash
        run: |
          set -e

          rm -rf aurix-build
          mkdir -p aurix-build

          unzip -q \
            "AURIX-Android-Release-v1-SDK-GRADLE.zip" \
            -d aurix-build

          echo
          echo "Archive content:"
          find aurix-build -maxdepth 3 -type f | sort | head -200


      # ============================================================
      # 4. FIND PROJECT ROOT
      # ============================================================

      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          ANDROID_DIR=""

          if [ -d "aurix-build/aurix-release/android" ]; then
            ANDROID_DIR="aurix-build/aurix-release/android"
          fi

          if [ -z "$ANDROID_DIR" ]; then
            FOUND=$(find aurix-build \
              -type f \
              -name "settings.gradle" \
              -print \
              | head -n 1)

            if [ -n "$FOUND" ]; then
              ANDROID_DIR="$(dirname "$FOUND")"
            fi
          fi

          if [ -z "$ANDROID_DIR" ]; then
            FOUND=$(find aurix-build \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              | head -n 1)

            if [ -n "$FOUND" ]; then
              ANDROID_DIR="$(dirname "$FOUND")"
            fi
          fi

          if [ -z "$ANDROID_DIR" ]; then
            echo
            echo "ERROR: Android project not found."
            echo
            echo "Available files:"
            find aurix-build -maxdepth 6 -type f -print | sort
            exit 1
          fi

          echo "Android project:"
          echo "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 5. FIND WEB DIRECTORY
      # ============================================================

      - name: Find AURIX web directory
        shell: bash
        run: |
          set -e

          WEB_DIR=""

          if [ -d "$ANDROID_DIR/../www" ]; then
            WEB_DIR="$ANDROID_DIR/../www"
          fi

          if [ -z "$WEB_DIR" ] && [ -d "aurix-build/aurix-release/www" ]; then
            WEB_DIR="aurix-build/aurix-release/www"
          fi

          if [ -z "$WEB_DIR" ]; then
            FOUND=$(find aurix-build \
              -type f \
              -name "index.html" \
              -print \
              | while read FILE; do
                  DIR="$(dirname "$FILE")"

                  if [ -f "$DIR/app.js" ] && \
                     [ -f "$DIR/styles.css" ]; then
                    echo "$DIR"
                    break
                  fi
                done)

            if [ -n "$FOUND" ]; then
              WEB_DIR="$FOUND"
            fi
          fi

          if [ -z "$WEB_DIR" ]; then
            echo
            echo "ERROR: AURIX web directory not found."
            echo
            find aurix-build \
              -maxdepth 7 \
              -type f \
              -print \
              | sort

            exit 1
          fi

          echo "Web directory:"
          echo "$WEB_DIR"

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 6. CHECK PROJECT
      # ============================================================

      - name: Validate AURIX project
        shell: bash
        run: |
          set -e

          echo "Android:"
          echo "$ANDROID_DIR"

          echo
          echo "Web:"
          echo "$WEB_DIR"

          echo
          echo "Checking Android project..."

          if [ ! -f "$ANDROID_DIR/settings.gradle" ] && \
             [ ! -f "$ANDROID_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -f "$ANDROID_DIR/app/build.gradle" ] && \
             [ ! -f "$ANDROID_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo
          echo "Checking web application..."

          test -f "$WEB_DIR/index.html"
          test -f "$WEB_DIR/app.js"
          test -f "$WEB_DIR/styles.css"

          if [ ! -f "$WEB_DIR/native-bridge.js" ]; then
            echo "WARNING: native-bridge.js not found."
          fi

          echo
          echo "Project validation: OK"


      # ============================================================
      # 7. JAVA
      # ============================================================

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # ============================================================
      # 8. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 9. INSTALL ANDROID SDK
      # ============================================================

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo
          echo "Installed SDK packages:"
          sdkmanager --list_installed \
            | grep -E "platforms;android-36|build-tools;36.0.0|platform-tools" \
            || true


      # ============================================================
      # 10. INSTALL GRADLE
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"


      # ============================================================
      # 11. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          gradle --version

          echo
          echo "Gradle available."


      # ============================================================
      # 12. RESTORE SIGNING KEY
      # ============================================================

      - name: Restore signing keystore
        shell: bash
        env:
          AURIX_KEYSTORE_BASE64: ${{ secrets.AURIX_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$AURIX_KEYSTORE_BASE64" ]; then
            echo "ERROR: AURIX_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$AURIX_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$ANDROID_DIR/aurix-release.jks"

          if [ ! -s "$ANDROID_DIR/aurix-release.jks" ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo "Keystore restored."


      # ============================================================
      # 13. COPY WEB ASSETS
      # ============================================================

      - name: Prepare Capacitor web assets
        shell: bash
        run: |
          set -e

          PUBLIC_DIR="$ANDROID_DIR/app/src/main/assets/public"

          echo "Target:"
          echo "$PUBLIC_DIR"

          rm -rf "$PUBLIC_DIR"

          mkdir -p "$PUBLIC_DIR"

          cp -R "$WEB_DIR"/. "$PUBLIC_DIR"/

          echo
          echo "Web assets copied."

          echo
          echo "Assets:"
          find "$PUBLIC_DIR" -maxdepth 2 -type f \
            -print | sort | head -200

          test -f "$PUBLIC_DIR/index.html"
          test -f "$PUBLIC_DIR/app.js"
          test -f "$PUBLIC_DIR/styles.css"

          echo
          echo "Web assets validation: OK"


      # ============================================================
      # 14. CHECK ANDROID MANIFEST
      # ============================================================

      - name: Validate Android manifest
        shell: bash
        run: |
          set -e

          MANIFEST="$ANDROID_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "AndroidManifest.xml found."

          echo
          echo "Permissions:"
          grep -n "uses-permission" "$MANIFEST" || true


      # ============================================================
      # 15. ADD REQUIRED NETWORK PERMISSION
      # ============================================================

      - name: Configure network permission
        shell: bash
        run: |
          set -e

          MANIFEST="$ANDROID_DIR/app/src/main/AndroidManifest.xml"

          if ! grep -q \
            'android.permission.INTERNET' \
            "$MANIFEST"; then

            python3 <<PY
from pathlib import Path

p = Path("$ANDROID_DIR/app/src/main/AndroidManifest.xml")

s = p.read_text(encoding="utf-8")

permission = """
    <uses-permission
        android:name="android.permission.INTERNET" />
"""

if "android.permission.INTERNET" not in s:
    marker = "<application"

    if marker not in s:
        raise SystemExit(
            "ERROR: <application> not found in AndroidManifest.xml"
        )

    s = s.replace(
        marker,
        permission + "\n    " + marker,
        1
    )

p.write_text(s, encoding="utf-8")

print("INTERNET permission added.")
PY

          else
            echo "INTERNET permission already present."
          fi


      # ============================================================
      # 16. CONFIGURE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        env:
          AURIX_KEYSTORE_PASSWORD: ${{ secrets.AURIX_KEYSTORE_PASSWORD }}
          AURIX_KEY_ALIAS: ${{ secrets.AURIX_KEY_ALIAS }}
          AURIX_KEY_PASSWORD: ${{ secrets.AURIX_KEY_PASSWORD }}
        run: |
          set -e

          BUILD_FILE=""

          if [ -f "$ANDROID_DIR/app/build.gradle" ]; then
            BUILD_FILE="$ANDROID_DIR/app/build.gradle"
          fi

          if [ -f "$ANDROID_DIR/app/build.gradle.kts" ]; then
            BUILD_FILE="$ANDROID_DIR/app/build.gradle.kts"
          fi

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: app build file not found."
            exit 1
          fi

          echo "Build file:"
          echo "$BUILD_FILE"

          python3 <<PY
from pathlib import Path
import re

p = Path("$BUILD_FILE")

s = p.read_text(encoding="utf-8")

# ------------------------------------------------------------
# Groovy build.gradle
# ------------------------------------------------------------

if p.suffix == ".gradle":

    if "signingConfigs" not in s:

        block = """
    signingConfigs {
        release {
            storeFile file("../aurix-release.jks")
            storePassword System.getenv("AURIX_KEYSTORE_PASSWORD")
            keyAlias System.getenv("AURIX_KEY_ALIAS")
            keyPassword System.getenv("AURIX_KEY_PASSWORD")
        }
    }

"""

        marker = "buildTypes {"

        if marker not in s:
            raise SystemExit(
                "ERROR: buildTypes block not found."
            )

        s = s.replace(
            marker,
            block + "    " + marker,
            1
        )

    if "signingConfig signingConfigs.release" not in s:

        match = re.search(
            r"buildTypes\s*\{",
            s
        )

        if not match:
            raise SystemExit(
                "ERROR: buildTypes block not found."
            )

        start = match.end()

        release = re.search(
            r"\brelease\s*\{",
            s[start:]
        )

        if not release:
            raise SystemExit(
                "ERROR: release build type not found."
            )

        insert_at = start + release.end()

        s = (
            s[:insert_at]
            + """
            signingConfig signingConfigs.release
"""
            + s[insert_at:]
        )

# ------------------------------------------------------------
# Kotlin build.gradle.kts
# ------------------------------------------------------------

elif p.suffix == ".kts":

    if "signingConfigs" not in s:
        raise SystemExit(
            "ERROR: Kotlin build file detected but "
            "automatic signing configuration is not enabled."
        )

p.write_text(s, encoding="utf-8")

print("Release signing configured.")
PY


      # ============================================================
      # 17. SHOW BUILD CONFIG
      # ============================================================

      - name: Show Android build configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID PROJECT"
          echo "========================================"

          echo "$ANDROID_DIR"

          echo
          echo "========================================"
          echo "SETTINGS"
          echo "========================================"

          if [ -f "$ANDROID_DIR/settings.gradle" ]; then
            cat "$ANDROID_DIR/settings.gradle"
          else
            cat "$ANDROID_DIR/settings.gradle.kts"
          fi

          echo
          echo "========================================"
          echo "APP BUILD"
          echo "========================================"

          if [ -f "$ANDROID_DIR/app/build.gradle" ]; then
            cat "$ANDROID_DIR/app/build.gradle"
          else
            cat "$ANDROID_DIR/app/build.gradle.kts"
          fi


      # ============================================================
      # 18. BUILD APK
      # ============================================================

      - name: Build signed release APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        env:
          AURIX_KEYSTORE_PASSWORD: ${{ secrets.AURIX_KEYSTORE_PASSWORD }}
          AURIX_KEY_ALIAS: ${{ secrets.AURIX_KEY_ALIAS }}
          AURIX_KEY_PASSWORD: ${{ secrets.AURIX_KEY_PASSWORD }}
        run: |
          set -e

          echo "Starting Gradle build..."

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            clean \
            assembleRelease


      # ============================================================
      # 19. FIND APK
      # ============================================================

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$ANDROID_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find \
            "$ANDROID_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo
          echo "APK:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ============================================================
      # 20. VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          test -f "$APK_PATH"

          ls -lh "$APK_PATH"

          echo
          echo "APK exists."


      # ============================================================
      # 21. VERIFY SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK_PATH"

          echo
          echo "APK signature: OK."


      # ============================================================
      # 22. VERIFY APK CONTENT
      # ============================================================

      - name: Verify web assets inside APK
        shell: bash
        run: |
          set -e

          echo "Checking APK contents..."

          unzip -l "$APK_PATH" \
            | grep -q "assets/public/index.html"

          unzip -l "$APK_PATH" \
            | grep -q "assets/public/app.js"

          unzip -l "$APK_PATH" \
            | grep -q "assets/public/styles.css"

          echo
          echo "AURIX web assets inside APK: OK."


      # ============================================================
      # 23. COPY FINAL APK
      # ============================================================

      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          cp "$APK_PATH" AURIX-release.apk

          test -s AURIX-release.apk

          echo
          echo "Final APK:"
          ls -lh AURIX-release.apk


      # ============================================================
      # 24. UPLOAD APK
      # ============================================================

      - name: Upload AURIX APK
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-release-signed
          path: AURIX-release.apk
          if-no-files-found: error
