name: Build AURIX APK

on:
  workflow_dispatch:

  push:
    paths:
      - "AURIX-Android-Release-v1-SDK-GRADLE.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check AURIX ZIP
        shell: bash
        run: |
          set -e

          test -f "AURIX-Android-Release-v1-SDK-GRADLE.zip"

          echo "AURIX ZIP:"
          ls -lh "AURIX-Android-Release-v1-SDK-GRADLE.zip"

      - name: Unpack AURIX
        shell: bash
        run: |
          set -e

          rm -rf aurix-build
          mkdir -p aurix-build

          unzip -q \
            "AURIX-Android-Release-v1-SDK-GRADLE.zip" \
            -d aurix-build

          echo
          echo "Project files:"
          find aurix-build/aurix-release/android \
            -maxdepth 3 \
            -type f \
            | sort

      - name: Check Android project
        shell: bash
        run: |
          set -e

          ANDROID_DIR="aurix-build/aurix-release/android"

          test -f "$ANDROID_DIR/settings.gradle"
          test -f "$ANDROID_DIR/build.gradle"
          test -f "$ANDROID_DIR/app/build.gradle"
          test -f "$ANDROID_DIR/app/src/main/AndroidManifest.xml"

          echo "Android project: OK"

      - name: Check AURIX web files
        shell: bash
        run: |
          set -e

          WEB_DIR="aurix-build/aurix-release/www"

          test -f "$WEB_DIR/index.html"
          test -f "$WEB_DIR/app.js"
          test -f "$WEB_DIR/styles.css"

          echo "AURIX web files: OK"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Check Gradle
        shell: bash
        run: |
          set -e

          gradle --version

      - name: Build AURIX debug APK
        shell: bash
        run: |
          set -e

          ANDROID_DIR="aurix-build/aurix-release/android"

          cd "$ANDROID_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            aurix-build/aurix-release/android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          mkdir -p output

          cp "$APK" output/AURIX.apk

      - name: Verify APK
        shell: bash
        run: |
          set -e

          test -s output/AURIX.apk

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            output/AURIX.apk

          echo
          echo "======================================"
          echo "AURIX APK READY"
          echo "======================================"

          ls -lh output/AURIX.apk

      - name: Upload AURIX APK
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-APK
          path: output/AURIX.apk
          if-no-files-found: error
