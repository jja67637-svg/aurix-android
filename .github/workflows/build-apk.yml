name: Build AURIX APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AURIX-Android-Release-v1-SDK-GRADLE.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack AURIX Android project
        run: |
          unzip -q AURIX-Android-Release-v1-SDK-GRADLE.zip
          test -f aurix-release/android/settings.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Fix Capacitor Android dependency
        working-directory: aurix-release/android
        run: |
          sed -i 's/com\.getcapacitor:capacitor-android:8\.5\.2/com.capacitorjs:core:8.5.2/g' app/build.gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Build release APK
        working-directory: aurix-release/android
        run: gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-release-APK
          path: aurix-release/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
