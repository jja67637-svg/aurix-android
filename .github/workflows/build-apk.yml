name: Build AURIX APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AURIX-Android-Release-v1-SDK-GRADLE.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Rozpakowanie projektu
      - name: Unpack AURIX Android project
        run: |
          unzip -q AURIX-Android-Release-v1-SDK-GRADLE.zip

          test -f aurix-release/android/settings.gradle
          test -f aurix-release/android/app/build.gradle
          test -f aurix-release/www/app.js
          test -f aurix-release/www/logo-512.png


      # 3. Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # 4. Przywrócenie klucza podpisującego
      - name: Restore signing keystore
        env:
          AURIX_KEYSTORE_BASE64: ${{ secrets.AURIX_KEYSTORE_BASE64 }}
        run: |
          echo "$AURIX_KEYSTORE_BASE64" | base64 --decode > aurix-release/android/aurix-release.jks
          test -s aurix-release/android/aurix-release.jks


      # 5. Poprawienie zależności Capacitor
      - name: Fix Capacitor dependency
        working-directory: aurix-release/android
        run: |
          sed -i \
            's/com\.getcapacitor:capacitor-android:8\.5\.2/com.capacitorjs:core:8.5.2/g' \
            app/build.gradle


      # 6. Poprawienie kompatybilności MainActivity
      - name: Fix MainActivity compatibility
        working-directory: aurix-release/android
        run: |
          sed -i 's/protected void onResume()/public void onResume()/g' \
            app/src/main/java/com/aurix/driver/MainActivity.java

          sed -i 's/protected void onDestroy()/public void onDestroy()/g' \
            app/src/main/java/com/aurix/driver/MainActivity.java

          grep -n "void onResume\|void onDestroy" \
            app/src/main/java/com/aurix/driver/MainActivity.java


      # 7. Konfiguracja podpisywania
      - name: Configure signing
        working-directory: aurix-release/android
        env:
          AURIX_KEYSTORE_PASSWORD: ${{ secrets.AURIX_KEYSTORE_PASSWORD }}
          AURIX_KEY_ALIAS: ${{ secrets.AURIX_KEY_ALIAS }}
          AURIX_KEY_PASSWORD: ${{ secrets.AURIX_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          if "signingConfigs {" not in s:
              signing = '''
              signingConfigs {
                  release {
                      storeFile file("../aurix-release.jks")
                      storePassword System.getenv("AURIX_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("AURIX_KEY_ALIAS")
                      keyPassword System.getenv("AURIX_KEY_PASSWORD")
                  }
              }
              '''

              s = s.replace(
                  "    buildTypes {",
                  signing + "\n    buildTypes {",
                  1
              )

          if "signingConfig signingConfigs.release" not in s:
              s = s.replace(
                  "        release {\n            minifyEnabled false",
                  "        release {\n            signingConfig signingConfigs.release\n            minifyEnabled false",
                  1
              )

          p.write_text(s)
          PY


      # 8. Ikona AURIX
      - name: Add AURIX launcher icon
        working-directory: aurix-release/android
        run: |
          mkdir -p app/src/main/res/drawable

          cp ../www/logo-512.png \
            app/src/main/res/drawable/aurix_icon.png

          test -s app/src/main/res/drawable/aurix_icon.png

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if 'android:icon="@drawable/aurix_icon"' not in s:
              s = s.replace(
                  'android:label="@string/app_name"',
                  'android:label="@string/app_name"\n'
                  '        android:icon="@drawable/aurix_icon"\n'
                  '        android:roundIcon="@drawable/aurix_icon"',
                  1
              )

          p.write_text(s)
          PY


      # 9. Android SDK 36
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"


      # 10. Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"


      # 11. Budowanie APK
      - name: Build signed release APK
        working-directory: aurix-release/android
        env:
          AURIX_KEYSTORE_PASSWORD: ${{ secrets.AURIX_KEYSTORE_PASSWORD }}
          AURIX_KEY_ALIAS: ${{ secrets.AURIX_KEY_ALIAS }}
          AURIX_KEY_PASSWORD: ${{ secrets.AURIX_KEY_PASSWORD }}
        run: |
          gradle --no-daemon clean assembleRelease


      # 12. Sprawdzenie podpisu
      - name: Verify APK signature
        working-directory: aurix-release/android
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify \
            --verbose \
            app/build/outputs/apk/release/*.apk


      # 13. Przygotowanie APK
      - name: Copy APK
        run: |
          APK=$(find \
            aurix-release/android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$APK"

          cp "$APK" AURIX-release.apk

          ls -lh AURIX-release.apk


      # 14. Udostępnienie APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-release-signed
          path: AURIX-release.apk
          if-no-files-found: error
