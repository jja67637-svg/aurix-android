name: Build AURIX APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AURIX-Android-Release-v1-SDK-GRADLE.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack AURIX Android project
        run: |
          unzip -q AURIX-Android-Release-v1-SDK-GRADLE.zip
          test -f aurix-release/android/settings.gradle
          test -f aurix-release/www/app.js
          test -f aurix-release/www/logo-512.png

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore signing keystore
        env:
          AURIX_KEYSTORE_BASE64: ${{ secrets.AURIX_KEYSTORE_BASE64 }}
        run: |
          echo "$AURIX_KEYSTORE_BASE64" | base64 --decode > aurix-release/android/aurix-release.jks
          test -s aurix-release/android/aurix-release.jks

      - name: Configure Android signing
        working-directory: aurix-release/android
        env:
          AURIX_KEYSTORE_PASSWORD: ${{ secrets.AURIX_KEYSTORE_PASSWORD }}
          AURIX_KEY_ALIAS: ${{ secrets.AURIX_KEY_ALIAS }}
          AURIX_KEY_PASSWORD: ${{ secrets.AURIX_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          signing = '''
              signingConfigs {
                  release {
                      storeFile file("../aurix-release.jks")
                      storePassword System.getenv("AURIX_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("AURIX_KEY_ALIAS")
                      keyPassword System.getenv("AURIX_KEY_PASSWORD")
                  }
              }
          '''

          if "signingConfigs {" not in s:
              s = s.replace(
                  "    buildTypes {",
                  signing + "\n    buildTypes {",
                  1
              )

          if "signingConfig signingConfigs.release" not in s:
              s = s.replace(
                  "        release {\n            minifyEnabled false",
                  "        release {\n            signingConfig signingConfigs.release\n            minifyEnabled false",
                  1
              )

          p.write_text(s)
          PY

      - name: Fix Capacitor Android dependency
        working-directory: aurix-release/android
        run: |
          sed -i 's/com\.getcapacitor:capacitor-android:8\.5\.2/com.capacitorjs:core:8.5.2/g' app/build.gradle

      - name: Fix Android compatibility
        working-directory: aurix-release/android
        run: |
          sed -i 's/protected void onResume()/public void onResume()/g' app/src/main/java/com/aurix/driver/MainActivity.java
          sed -i 's/protected void onDestroy()/public void onDestroy()/g' app/src/main/java/com/aurix/driver/MainActivity.java

      - name: Fix WebView startup and app icon
        working-directory: aurix-release/android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/aurix/driver/MainActivity.java")
          s = p.read_text()

          old = '''        WebView webView = getBridge().getWebView();
          webView.getSettings().setJavaScriptEnabled(true);
          webView.addJavascriptInterface(new NativeBridge(this), "AURIXNative");'''

          new = '''        WebView webView = getBridge().getWebView();
          webView.getSettings().setJavaScriptEnabled(true);
          webView.getSettings().setDomStorageEnabled(true);
          webView.getSettings().setGeolocationEnabled(true);
          webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
          webView.addJavascriptInterface(new NativeBridge(this), "AURIXNative");
          webView.postDelayed(() -> {
              try {
                  webView.clearCache(true);
                  webView.reload();
              } catch (Exception ignored) {}
          }, 250);'''

          if old in s:
              s = s.replace(old, new, 1)
          elif "webView.postDelayed(() ->" not in s:
              raise SystemExit("WebView block not found")

          p.write_text(s)
          PY

          mkdir -p app/src/main/res/drawable
          cp ../../www/logo-512.png app/src/main/res/drawable/aurix_icon.png

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()

          old = '''        android:label="@string/app_name"
          android:theme="@style/AppTheme"'''

          new = '''        android:label="@string/app_name"
          android:icon="@drawable/aurix_icon"
          android:roundIcon="@drawable/aurix_icon"
          android:theme="@style/AppTheme"'''

          if 'android:icon="@drawable/aurix_icon"' not in s:
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Disable service worker in Android build
        working-directory: aurix-release/www
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app.js")
          s = p.read_text()

          old = """if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(e=>console.warn('[AURIX] service worker',e));}"""

          new = """if(!window.AURIXNativeBridge?.available && 'serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(e=>console.warn('[AURIX] service worker',e));}"""

          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Build signed release APK
        working-directory: aurix-release/android
        env:
          AURIX_KEYSTORE_PASSWORD: ${{ secrets.AURIX_KEYSTORE_PASSWORD }}
          AURIX_KEY_ALIAS: ${{ secrets.AURIX_KEY_ALIAS }}
          AURIX_KEY_PASSWORD: ${{ secrets.AURIX_KEY_PASSWORD }}
        run: |
          gradle --no-daemon clean assembleRelease

      - name: Verify APK signature
        working-directory: aurix-release/android
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/release/*.apk

      - name: Find generated APK
        run: |
          find aurix-release/android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Rename APK
        run: |
          APK=$(find aurix-release/android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          cp "$APK" AURIX-release.apk
          ls -lh AURIX-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-release-signed
          path: AURIX-release.apk
          if-no-files-found: error
