name: Build AURIX APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AURIX-Android-Release-v1-SDK-GRADLE.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. ROZPAKOWANIE WEB + ANDROID
      # ============================================================

      - name: Unpack AURIX Android project
        run: |
          unzip -q AURIX-Android-Release-v1-SDK-GRADLE.zip

          test -f aurix-release/android/settings.gradle
          test -f aurix-release/android/app/build.gradle

          test -f aurix-release/www/index.html
          test -f aurix-release/www/app.js
          test -f aurix-release/www/styles.css
          test -f aurix-release/www/native-bridge.js
          test -f aurix-release/www/logo-512.png


      # ============================================================
      # 3. JAVA 21
      # ============================================================

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # ============================================================
      # 4. KLUCZ PODPISUJĄCY APK
      # ============================================================

      - name: Restore signing keystore
        env:
          AURIX_KEYSTORE_BASE64: ${{ secrets.AURIX_KEYSTORE_BASE64 }}
        run: |
          echo "$AURIX_KEYSTORE_BASE64" | base64 --decode > aurix-release/android/aurix-release.jks

          test -s aurix-release/android/aurix-release.jks


      # ============================================================
      # 5. NAPRAWA WEBVIEW + WEB APP
      # ============================================================

      - name: Patch AURIX Android runtime
        working-directory: aurix-release
        run: |

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")


          # ========================================================
          # INDEX.HTML
          #
          # app.js nie może być blokowany przez Leaflet CDN.
          # ========================================================

          p = root / "www/index.html"
          s = p.read_text()

          leaflet_old = (
              '<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" '
              'crossorigin=""></script>'
          )

          native_scripts = (
              '<script src="native-bridge.js"></script>'
              '<script src="app.js"></script>'
          )

          leaflet_async = (
              '<script async '
              'src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" '
              'crossorigin="" '
              'onload="window.dispatchEvent(new Event(\\'aurix:leaflet-ready\\'))" '
              'onerror="console.warn(\\'[AURIX] Leaflet CDN unavailable\\')">'
              '</script>'
          )

          leaflet_ready = (
              '<script>'
              'window.addEventListener("aurix:leaflet-ready",function(){'
              'try{'
              'if(typeof window.initMap==="function"){window.initMap();}'
              '}catch(e){'
              'console.error("[AURIX MAP]",e);'
              '}'
              '});'
              '</script>'
          )

          # Usuń istniejące skrypty AURIX.
          s = s.replace(native_scripts, "", 1)

          # Zamień blok Leaflet na:
          # native bridge -> app.js -> async Leaflet -> callback.
          if leaflet_old in s:
              s = s.replace(
                  leaflet_old,
                  native_scripts + leaflet_async + leaflet_ready,
                  1
              )
          else:
              # Jeśli wcześniejsza wersja już zmieniła Leaflet,
              # dopilnuj tylko obecności skryptów AURIX.
              if 'src="app.js"' not in s:
                  s = s.replace(
                      "</body>",
                      native_scripts + leaflet_async + leaflet_ready + "</body>",
                      1
                  )

          if "aurix:leaflet-ready" not in s:
              raise SystemExit(
                  "ERROR: Leaflet runtime patch was not applied"
              )

          if 'src="app.js"' not in s:
              raise SystemExit(
                  "ERROR: app.js is missing from index.html"
              )

          p.write_text(s)


          # ========================================================
          # APP.JS
          #
          # Map musi być odporna na brak Leaflet w pierwszej chwili.
          # ========================================================

          p = root / "www/app.js"
          s = p.read_text()

          old_map = (
              "function initMap(){"
              "state.map=L.map('mapCanvas',{zoomControl:true,"
              "attributionControl:true}).setView([52.1,19.4],6);"
          )

          new_map = (
              "function initMap(){"
              "if(state.map||!window.L)return;"
              "state.map=L.map('mapCanvas',{zoomControl:true,"
              "attributionControl:true}).setView([52.1,19.4],6);"
          )

          if old_map in s:
              s = s.replace(old_map, new_map, 1)

          elif new_map not in s:
              raise SystemExit(
                  "ERROR: initMap() pattern not found"
              )


          # ========================================================
          # SERVICE WORKER
          #
          # W APK nie może podawać starego JS/CSS.
          # ========================================================

          lines = s.splitlines()

          service_worker_found = False

          for i, line in enumerate(lines):

              if (
                  "navigator.serviceWorker.register" in line
                  and "sw.js" in line
              ):
                  lines[i] = (
                      "// Android build: Service Worker disabled."
                  )
                  service_worker_found = True

          if not service_worker_found:
              raise SystemExit(
                  "ERROR: Service Worker registration not found"
              )

          p.write_text("\n".join(lines) + "\n")


          # ========================================================
          # CSS
          #
          # Responsywność telefonu.
          # ========================================================

          p = root / "www/styles.css"
          s = p.read_text()

          marker = "/* AURIX Android responsive hardening */"

          if marker not in s:

              s += r'''
/* AURIX Android responsive hardening */

html,
body,
#app {
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
}

.screen {
  width: 100%;
  min-width: 0;
}

.bottom-nav {
  width: 100%;
  max-width: 100vw;
  box-sizing: border-box;
}

.bottom-nav button {
  min-width: 0;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.bottom-nav button span {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}

@media (max-width: 430px) {

  .topbar {
    padding-left: max(10px, env(safe-area-inset-left));
    padding-right: max(10px, env(safe-area-inset-right));
  }

  .screen {
    padding-left: 10px;
    padding-right: 10px;
  }

  .hero-card {
    padding: 16px;
  }

  .hero-card h1 {
    font-size: 25px;
  }

  .hero-card p {
    font-size: 14px;
  }

  .drive-btn {
    padding: 16px;
  }

  .bottom-nav {
    height: 64px;
    padding-bottom: max(env(safe-area-inset-bottom), 4px);
  }

  .bottom-nav button {
    height: 60px;
  }

  .bottom-nav button span:first-child {
    font-size: 18px;
    line-height: 18px;
  }

  .bottom-nav button span:last-child {
    font-size: 8px;
    line-height: 10px;
  }
}

@media (max-width: 360px) {

  .hero-card h1 {
    font-size: 22px;
  }

  .hero-orb {
    font-size: 64px;
  }

  .stat-grid {
    gap: 6px;
  }

  .stat-card {
    padding: 9px;
  }

  .stat-card b {
    font-size: 20px;
  }

  .bottom-nav button span:first-child {
    font-size: 16px;
  }

  .bottom-nav button span:last-child {
    font-size: 7px;
  }
}
'''

          p.write_text(s)


          # ========================================================
          # MAIN ACTIVITY
          # ========================================================

          p = root / (
              "android/app/src/main/java/com/aurix/driver/"
              "MainActivity.java"
          )

          s = p.read_text()


          # Importy WebView.
          if "import android.webkit.WebViewClient;" not in s:

              s = s.replace(
                  "import android.webkit.WebView;",
                  "import android.webkit.WebView;\n"
                  "import android.webkit.WebViewClient;\n"
                  "import android.webkit.WebChromeClient;\n"
                  "import android.util.Log;"
              )


          # BridgeActivity ma public lifecycle methods.
          s = s.replace(
              "protected void onResume()",
              "public void onResume()"
          )

          s = s.replace(
              "protected void onDestroy()",
              "public void onDestroy()"
          )


          # WebView.
          pattern = re.compile(
              r'        WebView webView = '
              r'getBridge\(\)\.getWebView\(\);\n'
              r'        webView\.getSettings\(\)'
              r'\.setJavaScriptEnabled\(true\);\n'
              r'        webView\.addJavascriptInterface\('
              r'new NativeBridge\(this\), "AURIXNative"\);'
          )

          replacement = '''        WebView webView = getBridge().getWebView();
          webView.getSettings().setJavaScriptEnabled(true);
          webView.getSettings().setDomStorageEnabled(true);
          webView.getSettings().setGeolocationEnabled(true);
          webView.getSettings().setMediaPlaybackRequiresUserGesture(false);

          webView.setWebViewClient(new WebViewClient());

          webView.setWebChromeClient(new WebChromeClient() {
              @Override
              public boolean onConsoleMessage(
                      android.webkit.ConsoleMessage message) {

                  Log.d(
                      "AURIX_WEB",
                      message.message()
                      + " @"
                      + message.lineNumber()
                      + " "
                      + message.sourceId()
                  );

                  return true;
              }
          });

          webView.addJavascriptInterface(
              new NativeBridge(this),
              "AURIXNative"
          );

          // NativeBridge jest dodawany po inicjalizacji Capacitor.
          // Jednorazowy reload powoduje ponowne uruchomienie web app
          // już z dostępnym AURIXNative.
          webView.postDelayed(() -> {
              try {
                  webView.clearCache(true);
                  webView.reload();
              } catch (Exception e) {
                  Log.e("AURIX_WEB", "reload failed", e);
              }
          }, 350);'''

          s, count = pattern.subn(
              replacement,
              s,
              count=1
          )

          if count != 1 and "setDomStorageEnabled(true)" not in s:
              raise SystemExit(
                  "ERROR: MainActivity WebView block not found"
              )

          p.write_text(s)


          # ========================================================
          # IKONA AURIX
          # ========================================================

          icon_dir = root / (
              "android/app/src/main/res/drawable"
          )

          icon_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          source_icon = root / "www/logo-512.png"
          target_icon = icon_dir / "aurix_icon.png"

          target_icon.write_bytes(
              source_icon.read_bytes()
          )


          # AndroidManifest
          p = root / "android/app/src/main/AndroidManifest.xml"
          s = p.read_text()

          if 'android:icon="@drawable/aurix_icon"' not in s:

              s = s.replace(
                  'android:label="@string/app_name"',
                  'android:label="@string/app_name"\n'
                  '        android:icon="@drawable/aurix_icon"\n'
                  '        android:roundIcon="@drawable/aurix_icon"',
                  1
              )

          p.write_text(s)


          # ========================================================
          # KONTROLA
          # ========================================================

          assert (root / "www/app.js").exists()
          assert (root / "www/index.html").exists()
          assert (root / "www/styles.css").exists()
          assert target_icon.exists()

          print("AURIX Android runtime patch: OK")
          PY


      # ============================================================
      # 6. CAPACITOR
      # ============================================================

      - name: Fix Capacitor dependency
        working-directory: aurix-release/android
        run: |
          sed -i \
            's/com\.getcapacitor:capacitor-android:8\.5\.2/com.capacitorjs:core:8.5.2/g' \
            app/build.gradle


      # ============================================================
      # 7. PODPISYWANIE
      # ============================================================

      - name: Configure signing
        working-directory: aurix-release/android
        env:
          AURIX_KEYSTORE_PASSWORD: ${{ secrets.AURIX_KEYSTORE_PASSWORD }}
          AURIX_KEY_ALIAS: ${{ secrets.AURIX_KEY_ALIAS }}
          AURIX_KEY_PASSWORD: ${{ secrets.AURIX_KEY_PASSWORD }}
        run: |

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          if "signingConfigs {" not in s:

              signing = '''
              signingConfigs {
                  release {
                      storeFile file("../aurix-release.jks")
                      storePassword System.getenv("AURIX_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("AURIX_KEY_ALIAS")
                      keyPassword System.getenv("AURIX_KEY_PASSWORD")
                  }
              }
              '''

              s = s.replace(
                  "    buildTypes {",
                  signing + "\n    buildTypes {",
                  1
              )

          if "signingConfig signingConfigs.release" not in s:

              s = s.replace(
                  "        release {\n"
                  "            minifyEnabled false",
                  "        release {\n"
                  "            signingConfig signingConfigs.release\n"
                  "            minifyEnabled false",
                  1
              )

          p.write_text(s)
          PY


      # ============================================================
      # 8. ANDROID SDK 36
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"


      # ============================================================
      # 9. GRADLE
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"


      # ============================================================
      # 10. BUILD APK
      # ============================================================

      - name: Build signed release APK
        working-directory: aurix-release/android
        env:
          AURIX_KEYSTORE_PASSWORD: ${{ secrets.AURIX_KEYSTORE_PASSWORD }}
          AURIX_KEY_ALIAS: ${{ secrets.AURIX_KEY_ALIAS }}
          AURIX_KEY_PASSWORD: ${{ secrets.AURIX_KEY_PASSWORD }}
        run: |
          gradle --no-daemon clean assembleRelease


      # ============================================================
      # 11. WERYFIKACJA PODPISU
      # ============================================================

      - name: Verify APK signature
        working-directory: aurix-release/android
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify \
            --verbose \
            app/build/outputs/apk/release/*.apk


      # ============================================================
      # 12. SPRAWDZENIE WEB APP W APK
      # ============================================================

      - name: Verify AURIX web assets are inside APK
        working-directory: aurix-release/android
        run: |

          APK=$(find \
            app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$APK"

          unzip -l "$APK" | grep -q "assets/public/app.js"
          unzip -l "$APK" | grep -q "assets/public/index.html"
          unzip -l "$APK" | grep -q "assets/public/styles.css"
          unzip -l "$APK" | grep -q "assets/public/native-bridge.js"
          unzip -l "$APK" | grep -q "assets/public/logo-512.png"

          echo "AURIX web assets: OK"


      # ============================================================
      # 13. APK
      # ============================================================

      - name: Copy APK
        run: |

          APK=$(find \
            aurix-release/android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$APK"

          cp "$APK" AURIX-release.apk

          ls -lh AURIX-release.apk


      # ============================================================
      # 14. ARTIFACT
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-release-signed
          path: AURIX-release.apk
          if-no-files-found: error
