name: Build AURIX APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AURIX-Android-Release-v1-SDK-GRADLE-FIXED.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project
        shell: bash
        run: |
          set -e

          ZIP="AURIX-Android-Release-v1-SDK-GRADLE-FIXED.zip"

          test -f "$ZIP"

          rm -rf aurix-build
          mkdir -p aurix-build

          unzip -q "$ZIP" -d aurix-build

          if [ -f "aurix-build/aurix-release/android/settings.gradle" ]; then
            echo "ANDROID_DIR=aurix-build/aurix-release/android" >> "$GITHUB_ENV"
            echo "PROJECT_DIR=aurix-build/aurix-release" >> "$GITHUB_ENV"
          elif [ -f "aurix-build/android/settings.gradle" ]; then
            echo "ANDROID_DIR=aurix-build/android" >> "$GITHUB_ENV"
            echo "PROJECT_DIR=aurix-build" >> "$GITHUB_ENV"
          else
            echo "Android project not found"
            find aurix-build -name settings.gradle
            exit 1
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and sync Capacitor
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npm install --no-audit --no-fund

          npx cap sync android

            - name: Fix Capacitor Android dependency
        shell: bash
        run: |
          set -e

          SETTINGS="$ANDROID_DIR/settings.gradle"
          ROOT_GRADLE="$ANDROID_DIR/build.gradle"
          APP_GRADLE="$ANDROID_DIR/app/build.gradle"
          CAP_DIR="$PROJECT_DIR/node_modules/@capacitor/android/capacitor"

          test -f "$CAP_DIR/build.gradle"

          # settings.gradle — lokalny Capacitor, bez dependencyResolutionManagement
          printf '%s\n' \
            'pluginManagement {' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '        gradlePluginPortal()' \
            '    }' \
            '}' \
            '' \
            "rootProject.name = 'AURIX'" \
            '' \
            "include ':app'" \
            "include ':capacitor-android'" \
            "project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')" \
            > "$SETTINGS"

          # build.gradle — repozytoria dla zależności aplikacji
          printf '%s\n' \
            "plugins {" \
            "    id 'com.android.application' version '8.13.0' apply false" \
            "}" \
            '' \
            "allprojects {" \
            "    repositories {" \
            "        google()" \
            "        mavenCentral()" \
            "    }" \
            "}" \
            > "$ROOT_GRADLE"

          # app/build.gradle — lokalny moduł Capacitor
          python3 -c "from pathlib import Path; p=Path('$APP_GRADLE'); s=p.read_text(); s=s.replace(\"implementation 'com.getcapacitor:capacitor-android:8.5.2'\", \"implementation project(':capacitor-android')\"); p.write_text(s)"

          grep -q "include ':capacitor-android'" "$SETTINGS"
          grep -q "project(':capacitor-android')" "$SETTINGS"
          grep -q "google()" "$ROOT_GRADLE"
          grep -q "mavenCentral()" "$ROOT_GRADLE"
          grep -q "implementation project(':capacitor-android')" "$APP_GRADLE"

          echo "Capacitor + repositories configured correctly."
        shell: bash
        run: |
          set -e

          SETTINGS="$ANDROID_DIR/settings.gradle"
          APP_GRADLE="$ANDROID_DIR/app/build.gradle"
          CAP_DIR="$PROJECT_DIR/node_modules/@capacitor/android/capacitor"

          test -f "$CAP_DIR/build.gradle"

          printf '%s\n' \
            'pluginManagement {' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '        gradlePluginPortal()' \
            '    }' \
            '}' \
            '' \
            "rootProject.name = 'AURIX'" \
            '' \
            "include ':app'" \
            "include ':capacitor-android'" \
            "project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')" \
            > "$SETTINGS"

          python3 -c "from pathlib import Path; p=Path('$ANDROID_DIR/app/build.gradle'); s=p.read_text(); s=s.replace(\"implementation 'com.getcapacitor:capacitor-android:8.5.2'\", \"implementation project(':capacitor-android')\"); p.write_text(s)"

          grep -q "include ':capacitor-android'" "$SETTINGS"

          grep -q "implementation project(':capacitor-android')" "$APP_GRADLE"

          echo "Capacitor local module configured."

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "======================================"
          echo "BUILDING AURIX APK"
          echo "======================================"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Verify and stage APK
        shell: bash
        run: |
          set -e

          APK="$(find "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK was not created."
            find "$ANDROID_DIR/app/build" -type f 2>/dev/null | sort
            exit 1
          fi

          mkdir -p output

          cp "$APK" output/AURIX.apk

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            output/AURIX.apk

          ls -lh output/AURIX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-APK
          path: output/AURIX.apk
          if-no-files-found: error
