name: Build AURIX APK

on:
  workflow_dispatch:

  push:
    paths:
      - "AURIX-Android-Release-v1-SDK-GRADLE.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. CHECK ZIP
      # ============================================================

      - name: Check Android SDK archive
        shell: bash
        run: |
          set -e

          test -f "AURIX-Android-Release-v1-SDK-GRADLE.zip"

          echo "AURIX Android archive found:"
          ls -lh "AURIX-Android-Release-v1-SDK-GRADLE.zip"


      # ============================================================
      # 3. UNPACK
      # ============================================================

      - name: Unpack AURIX Android project
        shell: bash
        run: |
          set -e

          rm -rf aurix-release

          unzip -q "AURIX-Android-Release-v1-SDK-GRADLE.zip"

          echo "Checking project..."

          test -d "aurix-release"
          test -d "aurix-release/android"
          test -d "aurix-release/www"

          test -f "aurix-release/android/settings.gradle"
          test -f "aurix-release/android/app/build.gradle"

          test -f "aurix-release/www/index.html"
          test -f "aurix-release/www/app.js"
          test -f "aurix-release/www/styles.css"
          test -f "aurix-release/www/native-bridge.js"
          test -f "aurix-release/www/logo-512.png"

          echo "AURIX project structure: OK"


      # ============================================================
      # 4. JAVA 21
      # ============================================================

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle


      # ============================================================
      # 5. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK: OK"


      # ============================================================
      # 6. RESTORE SIGNING KEY
      # ============================================================

      - name: Restore signing keystore
        shell: bash
        env:
          AURIX_KEYSTORE_BASE64: ${{ secrets.AURIX_KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$AURIX_KEYSTORE_BASE64"

          echo "$AURIX_KEYSTORE_BASE64" \
            | base64 --decode \
            > aurix-release/android/aurix-release.jks

          test -s aurix-release/android/aurix-release.jks

          echo "Signing keystore: OK"


      # ============================================================
      # 7. PATCH WEB + ANDROID
      # ============================================================

      - name: Patch AURIX Android runtime
        working-directory: aurix-release
        shell: bash
        run: |

          set -e

          python3 <<'PY'

          from pathlib import Path
          import re
          import textwrap


          root = Path(".")


          # ========================================================
          # INDEX.HTML
          # ========================================================

          p = root / "www/index.html"

          s = p.read_text(encoding="utf-8")


          # --------------------------------------------------------
          # Usuń stare AURIX scripts
          # --------------------------------------------------------

          s = re.sub(
              r'<script[^>]+src=["\']native-bridge\.js["\'][^>]*></script>',
              '',
              s,
              flags=re.I
          )

          s = re.sub(
              r'<script[^>]+src=["\']app\.js["\'][^>]*></script>',
              '',
              s,
              flags=re.I
          )


          # --------------------------------------------------------
          # Usuń stare Leaflet
          # --------------------------------------------------------

          s = re.sub(
              r'<script[^>]+src=["\']https://unpkg\.com/leaflet@1\.9\.4/dist/leaflet\.js["\'][^>]*></script>',
              '',
              s,
              flags=re.I
          )


          # --------------------------------------------------------
          # Runtime scripts
          # --------------------------------------------------------

          runtime_scripts = """
          <script src="native-bridge.js"></script>
          <script src="app.js"></script>

          <script
              src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
              crossorigin="">
          </script>

          <script>
          window.addEventListener("load", function () {
              try {
                  if (typeof window.initMap === "function") {
                      window.initMap();
                  }
              } catch (e) {
                  console.error("[AURIX MAP]", e);
              }
          });
          </script>
          """


          # --------------------------------------------------------
          # Wstaw przed </body>
          # --------------------------------------------------------

          if re.search(r'</body>', s, flags=re.I) is None:
              raise SystemExit(
                  "ERROR: index.html does not contain </body>"
              )


          s = re.sub(
              r'</body>',
              runtime_scripts + "\n</body>",
              s,
              count=1,
              flags=re.I
          )


          # --------------------------------------------------------
          # Kontrola
          # --------------------------------------------------------

          if 'src="app.js"' not in s:
              raise SystemExit(
                  "ERROR: app.js missing from index.html"
              )

          if 'src="native-bridge.js"' not in s:
              raise SystemExit(
                  "ERROR: native-bridge.js missing from index.html"
              )


          p.write_text(
              s,
              encoding="utf-8"
          )


          # ========================================================
          # APP.JS
          # ========================================================

          p = root / "www/app.js"

          s = p.read_text(encoding="utf-8")


          # --------------------------------------------------------
          # Bezpieczny initMap
          # --------------------------------------------------------

          if "function initMap()" not in s:

              raise SystemExit(
                  "ERROR: initMap() not found in app.js"
              )


          if "__AURIX_MAP_INITIALIZED__" not in s:

              s = re.sub(
                  r'function\s+initMap\s*\(\)\s*\{',

                  """function initMap(){

              if (window.__AURIX_MAP_INITIALIZED__) {
                  return;
              }

              if (!window.L) {
                  console.warn("[AURIX] Leaflet is not ready");
                  return;
              }

              window.__AURIX_MAP_INITIALIZED__ = true;

                  """,

                  s,

                  count=1
              )


          # --------------------------------------------------------
          # Service Worker
          # --------------------------------------------------------

          s = re.sub(
              r'navigator\.serviceWorker\.register\s*\([^;]+;?',
              '// Android build: Service Worker disabled.',
              s,
              flags=re.S
          )


          p.write_text(
              s,
              encoding="utf-8"
          )


          # ========================================================
          # CSS
          # ========================================================

          p = root / "www/styles.css"

          s = p.read_text(encoding="utf-8")


          marker = "/* AURIX Android responsive hardening */"


          if marker not in s:

              css = r"""
          /* AURIX Android responsive hardening */

          html,
          body,
          #app {
            width: 100%;
            max-width: 100vw;
            min-width: 0;
            overflow-x: hidden;
          }

          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }

          img,
          video,
          canvas,
          svg {
            max-width: 100%;
          }

          .screen {
            width: 100%;
            max-width: 100vw;
            min-width: 0;
          }

          .bottom-nav {
            width: 100%;
            max-width: 100vw;
            box-sizing: border-box;
            overflow: hidden;
          }

          .bottom-nav button {
            min-width: 0;
            max-width: 100%;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
          }

          .bottom-nav button span {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
          }

          input,
          button,
          select,
          textarea {
            max-width: 100%;
          }

          button,
          a {
            touch-action: manipulation;
          }

          @media (max-width: 430px) {

            .topbar {
              padding-left: max(10px, env(safe-area-inset-left));
              padding-right: max(10px, env(safe-area-inset-right));
            }

            .screen {
              padding-left: 10px;
              padding-right: 10px;
            }

            .hero-card {
              padding: 16px;
            }

            .hero-card h1 {
              font-size: 25px;
            }

            .hero-card p {
              font-size: 14px;
            }

            .drive-btn {
              padding: 16px;
            }

            .bottom-nav {
              min-height: 64px;
              padding-bottom: max(
                env(safe-area-inset-bottom),
                4px
              );
            }

            .bottom-nav button {
              height: 60px;
            }

            .bottom-nav button span:first-child {
              font-size: 18px;
              line-height: 18px;
            }

            .bottom-nav button span:last-child {
              font-size: 8px;
              line-height: 10px;
            }
          }

          @media (max-width: 360px) {

            .hero-card h1 {
              font-size: 22px;
            }

            .hero-orb {
              font-size: 64px;
            }

            .stat-grid {
              gap: 6px;
            }

            .stat-card {
              padding: 9px;
            }

            .stat-card b {
              font-size: 20px;
            }

            .bottom-nav button span:first-child {
              font-size: 16px;
            }

            .bottom-nav button span:last-child {
              font-size: 7px;
            }
          }
          """

              s += "\n" + textwrap.dedent(css) + "\n"


          p.write_text(
              s,
              encoding="utf-8"
          )


          # ========================================================
          # MAIN ACTIVITY
          # ========================================================

          p = root / (
              "android/app/src/main/java/com/aurix/driver/"
              "MainActivity.java"
          )


          if not p.exists():

              raise SystemExit(
                  "ERROR: MainActivity.java not found"
              )


          s = p.read_text(encoding="utf-8")


          # --------------------------------------------------------
          # Importy
          # --------------------------------------------------------

          if "import android.webkit.WebViewClient;" not in s:

              s = s.replace(
                  "import android.webkit.WebView;",

                  """import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.util.Log;"""
              )


          # --------------------------------------------------------
          # Lifecycle
          # --------------------------------------------------------

          s = s.replace(
              "protected void onResume()",
              "public void onResume()"
          )

          s = s.replace(
              "protected void onDestroy()",
              "public void onDestroy()"
          )


          # --------------------------------------------------------
          # WebView
          # --------------------------------------------------------

          if "setDomStorageEnabled(true)" not in s:

              pattern = re.compile(
                  r'WebView\s+webView\s*=\s*'
                  r'getBridge\(\)\.getWebView\(\)\s*;'
                  r'.*?'
                  r'webView\.addJavascriptInterface\('
                  r'\s*new NativeBridge\(this\)\s*,'
                  r'\s*"AURIXNative"\s*\)\s*;',
                  re.S
              )


              replacement = """

          WebView webView = getBridge().getWebView();

          webView.getSettings().setJavaScriptEnabled(true);

          webView.getSettings().setDomStorageEnabled(true);

          webView.getSettings().setGeolocationEnabled(true);

          webView.getSettings()
              .setMediaPlaybackRequiresUserGesture(false);


          webView.setWebViewClient(
              new WebViewClient()
          );


          webView.setWebChromeClient(
              new WebChromeClient() {

                  @Override
                  public boolean onConsoleMessage(
                          android.webkit.ConsoleMessage message) {

                      Log.d(
                          "AURIX_WEB",
                          message.message()
                          + " @"
                          + message.lineNumber()
                          + " "
                          + message.sourceId()
                      );

                      return true;
                  }
              }
          );


          webView.addJavascriptInterface(
              new NativeBridge(this),
              "AURIXNative"
          );

              """


              s, count = pattern.subn(
                  textwrap.dedent(replacement).strip(),
                  s,
                  count=1
              )


              if count != 1:

                  raise SystemExit(
                      "ERROR: MainActivity WebView block not found"
                  )


          p.write_text(
              s,
              encoding="utf-8"
          )


          # ========================================================
          # ICON
          # ========================================================

          icon_dir = root / (
              "android/app/src/main/res/drawable"
          )

          icon_dir.mkdir(
              parents=True,
              exist_ok=True
          )


          source_icon = root / "www/logo-512.png"

          target_icon = icon_dir / "aurix_icon.png"


          if not source_icon.exists():

              raise SystemExit(
                  "ERROR: www/logo-512.png not found"
              )


          target_icon.write_bytes(
              source_icon.read_bytes()
          )


          # ========================================================
          # MANIFEST
          # ========================================================

          p = root / (
              "android/app/src/main/AndroidManifest.xml"
          )


          if not p.exists():

              raise SystemExit(
                  "ERROR: AndroidManifest.xml not found"
              )


          s = p.read_text(encoding="utf-8")


          if 'android:icon="@drawable/aurix_icon"' not in s:

              s = s.replace(
                  'android:label="@string/app_name"',

                  """android:label="@string/app_name"
                  android:icon="@drawable/aurix_icon"
                  android:roundIcon="@drawable/aurix_icon" """,

                  1
              )


          p.write_text(
              s,
              encoding="utf-8"
          )


          # ========================================================
          # FINAL VALIDATION
          # ========================================================

          required = [

              "www/index.html",
              "www/app.js",
              "www/styles.css",
              "www/native-bridge.js",
              "www/logo-512.png",

              "android/settings.gradle",
              "android/app/build.gradle",

              "android/app/src/main/AndroidManifest.xml",

          ]


          for item in required:

              if not (root / item).exists():

                  raise SystemExit(
                      f"ERROR: missing required file: {item}"
                  )


          print("")
          print("========================================")
          print(" AURIX Android runtime patch: OK")
          print("========================================")
          print("")

          PY


      # ============================================================
      # 8. CHECK GRADLE WRAPPER
      # ============================================================

      - name: Check Gradle wrapper
        working-directory: aurix-release/android
        shell: bash
        run: |
          set -e

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          ./gradlew --version

          echo "Gradle wrapper: OK"


      # ============================================================
      # 9. CONFIGURE SIGNING
      # ============================================================

      - name: Configure release signing
        working-directory: aurix-release/android
        shell: bash
        env:
          AURIX_KEYSTORE_PASSWORD: ${{ secrets.AURIX_KEYSTORE_PASSWORD }}
          AURIX_KEY_ALIAS: ${{ secrets.AURIX_KEY_ALIAS }}
          AURIX_KEY_PASSWORD: ${{ secrets.AURIX_KEY_PASSWORD }}
        run: |

          set -e

          python3 <<'PY'

          from pathlib import Path


          p = Path("app/build.gradle")

          s = p.read_text(
              encoding="utf-8"
          )


          # --------------------------------------------------------
          # signingConfigs
          # --------------------------------------------------------

          if "signingConfigs {" not in s:

              signing_block = """

              signingConfigs {

                  release {

                      storeFile file(
                          "../aurix-release.jks"
                      )

                      storePassword System.getenv(
                          "AURIX_KEYSTORE_PASSWORD"
                      )

                      keyAlias System.getenv(
                          "AURIX_KEY_ALIAS"
                      )

                      keyPassword System.getenv(
                          "AURIX_KEY_PASSWORD"
                      )
                  }
              }

              """

              if "buildTypes {" not in s:

                  raise SystemExit(
                      "ERROR: buildTypes block not found"
                  )

              s = s.replace(
                  "buildTypes {",
                  signing_block + "\nbuildTypes {",
                  1
              )


          # --------------------------------------------------------
          # release signing
          # --------------------------------------------------------

          if "signingConfig signingConfigs.release" not in s:

              release_marker = "release {"


              pos = s.find(
                  release_marker
              )


              if pos == -1:

                  raise SystemExit(
                      "ERROR: release buildType not found"
                  )


              insert_pos = (
                  pos
                  + len(release_marker)
              )


              s = (
                  s[:insert_pos]
                  + """
                      signingConfig signingConfigs.release
                  """
                  + s[insert_pos:]
              )


          p.write_text(
              s,
              encoding="utf-8"
          )


          print(
              "Release signing configuration: OK"
          )

          PY


      # ============================================================
      # 10. BUILD
      # ============================================================

      - name: Build signed release APK
        working-directory: aurix-release/android
        shell: bash
        env:
          AURIX_KEYSTORE_PASSWORD: ${{ secrets.AURIX_KEYSTORE_PASSWORD }}
          AURIX_KEY_ALIAS: ${{ secrets.AURIX_KEY_ALIAS }}
          AURIX_KEY_PASSWORD: ${{ secrets.AURIX_KEY_PASSWORD }}
        run: |

          set -e

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleRelease


      # ============================================================
      # 11. FIND APK
      # ============================================================

      - name: Locate APK
        working-directory: aurix-release/android
        shell: bash
        run: |

          set -e

          find \
            app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print


      # ============================================================
      # 12. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        working-directory: aurix-release/android
        shell: bash
        run: |

          set -e

          APK=$(
            find \
              app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              | head -n 1
          )

          test -n "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo "APK signature: OK"


      # ============================================================
      # 13. VERIFY APK CONTENT
      # ============================================================

      - name: Verify AURIX web assets inside APK
        working-directory: aurix-release/android
        shell: bash
        run: |

          set -e

          APK=$(
            find \
              app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              | head -n 1
          )

          test -n "$APK"


          unzip -l "$APK" \
            | grep -q "assets/public/index.html"


          unzip -l "$APK" \
            | grep -q "assets/public/app.js"


          unzip -l "$APK" \
            | grep -q "assets/public/styles.css"


          unzip -l "$APK" \
            | grep -q "assets/public/native-bridge.js"


          unzip -l "$APK" \
            | grep -q "assets/public/logo-512.png"


          echo "AURIX web assets inside APK: OK"


      # ============================================================
      # 14. COPY APK
      # ============================================================

      - name: Prepare final APK
        shell: bash
        run: |

          set -e

          APK=$(
            find \
              aurix-release/android/app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              | head -n 1
          )

          test -n "$APK"

          cp "$APK" AURIX-release.apk

          test -s AURIX-release.apk

          ls -lh AURIX-release.apk


      # ============================================================
      # 15. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload AURIX APK
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-release-signed
          path: AURIX-release.apk
          if-no-files-found: error
