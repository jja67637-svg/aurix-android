name: Build AURIX APK

on:
  workflow_dispatch:

  push:
    paths:
      - "AURIX-Android-Release-v1-SDK-GRADLE-FIXED.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # CHECK ZIP
      # =========================================================

      - name: Check AURIX ZIP
        shell: bash
        run: |
          set -e

          ZIP="AURIX-Android-Release-v1-SDK-GRADLE-FIXED.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: AURIX ZIP not found"
            ls -lah
            exit 1
          fi

          echo "AURIX ZIP found:"
          ls -lh "$ZIP"


      # =========================================================
      # UNPACK
      # =========================================================

      - name: Unpack AURIX
        shell: bash
        run: |
          set -e

          rm -rf aurix-build
          mkdir -p aurix-build

          unzip -q \
            "AURIX-Android-Release-v1-SDK-GRADLE-FIXED.zip" \
            -d aurix-build

          echo "Project structure:"
          find aurix-build -maxdepth 4 -type f | sort | head -300


      # =========================================================
      # DETECT ANDROID PROJECT
      # =========================================================

      - name: Detect Android project
        shell: bash
        run: |
          set -e

          ANDROID_DIR=""

          if [ -f "aurix-build/aurix-release/android/settings.gradle" ]; then
            ANDROID_DIR="aurix-build/aurix-release/android"

          elif [ -f "aurix-build/android/settings.gradle" ]; then
            ANDROID_DIR="aurix-build/android"

          else
            echo "ERROR: Android project not found"

            find aurix-build \
              -name settings.gradle \
              -o -name settings.gradle.kts

            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Android project:"
          echo "$ANDROID_DIR"


      # =========================================================
      # CHECK ANDROID PROJECT
      # =========================================================

      - name: Check Android project
        shell: bash
        run: |
          set -e

          test -f "$ANDROID_DIR/settings.gradle"
          test -f "$ANDROID_DIR/build.gradle"
          test -f "$ANDROID_DIR/app/build.gradle"
          test -f "$ANDROID_DIR/app/src/main/AndroidManifest.xml"

          echo "Android project: OK"


      # =========================================================
      # CHECK WEB FILES
      # =========================================================

      - name: Check AURIX web files
        shell: bash
        run: |
          set -e

          if [ -d "$ANDROID_DIR/../www" ]; then
            WEB_DIR="$ANDROID_DIR/../www"

          elif [ -d "aurix-build/aurix-release/www" ]; then
            WEB_DIR="aurix-build/aurix-release/www"

          else
            echo "WARNING: www directory not found"
            exit 0
          fi

          test -f "$WEB_DIR/index.html"
          test -f "$WEB_DIR/app.js"
          test -f "$WEB_DIR/styles.css"

          echo "AURIX web files: OK"


      # =========================================================
      # NODE.JS
      # =========================================================

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # =========================================================
      # NPM / CAPACITOR
      # =========================================================

      - name: Install Capacitor dependencies
        shell: bash
        run: |
          set -e

          cd aurix-build/aurix-release

          echo "Node version:"
          node --version

          echo ""
          echo "NPM version:"
          npm --version

          echo ""
          echo "Installing dependencies..."

          npm install \
            --no-audit \
            --no-fund

          echo ""
          echo "Dependencies installed successfully."


      # =========================================================
      # CAPACITOR SYNC
      # =========================================================

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -e

          cd aurix-build/aurix-release

          echo "Running Capacitor sync..."

          npx cap sync android

          echo ""
          echo "Capacitor sync completed successfully."


      # =========================================================
      # FIX CAPACITOR ANDROID
      # =========================================================

      - name: Fix Capacitor Android module
        shell: bash
        run: |
          set -e

          PROJECT_DIR="aurix-build/aurix-release"
          ANDROID_DIR="$PROJECT_DIR/android"

          SETTINGS="$ANDROID_DIR/settings.gradle"
          APP_GRADLE="$ANDROID_DIR/app/build.gradle"

          CAP_DIR="$PROJECT_DIR/node_modules/@capacitor/android"

          echo ""
          echo "======================================"
          echo "FIXING CAPACITOR ANDROID"
          echo "======================================"

          # -------------------------------------------------------
          # CHECK MODULE
          # -------------------------------------------------------

          echo ""
          echo "Checking @capacitor/android..."

          if [ ! -d "$CAP_DIR" ]; then
            echo "ERROR: @capacitor/android not found:"
            echo "$CAP_DIR"
            exit 1
          fi

          if [ ! -f "$CAP_DIR/capacitor/build.gradle" ]; then
            echo "ERROR: Capacitor Android Gradle module not found:"
            echo "$CAP_DIR/capacitor/build.gradle"
            exit 1
          fi

          echo "@capacitor/android: OK"


          # -------------------------------------------------------
          # PATCH SETTINGS.GRADLE
          # -------------------------------------------------------

          echo ""
          echo "Patching settings.gradle..."

          python3 <<'PY'
          from pathlib import Path

          p = Path("aurix-build/aurix-release/android/settings.gradle")

          s = p.read_text()

          include_line = "include ':capacitor-android'"

          project_line = (
              "project(':capacitor-android').projectDir = "
              "new File('../node_modules/@capacitor/android/capacitor')"
          )

          if include_line not in s:
              s += "\n" + include_line + "\n"

          if project_line not in s:
              s += project_line + "\n"

          p.write_text(s)

          print("settings.gradle patched successfully.")
          PY


          # -------------------------------------------------------
          # PATCH APP BUILD.GRADLE
          # -------------------------------------------------------

          echo ""
          echo "Patching app/build.gradle..."

          python3 <<'PY'
          from pathlib import Path

          p = Path("aurix-build/aurix-release/android/app/build.gradle")

          s = p.read_text()

          old = "implementation 'com.getcapacitor:capacitor-android:8.5.2'"

          new = "implementation project(':capacitor-android')"

          if old in s:
              s = s.replace(old, new)
              print("Maven Capacitor dependency replaced.")

          elif new in s:
              print("Local Capacitor dependency already present.")

          else:
              print("")
              print("Searching for Capacitor dependency...")

              lines = s.splitlines()

              found = False

              for i, line in enumerate(lines):

                  if "capacitor-android" in line:

                      print("Found:")
                      print(line)

                      lines[i] = "    implementation project(':capacitor-android')"

                      found = True

              if not found:
                  raise SystemExit(
                      "ERROR: Capacitor Android dependency was not found."
                  )

              s = "\n".join(lines) + "\n"

          p.write_text(s)

          print("app/build.gradle patched successfully.")
          PY


          # -------------------------------------------------------
          # SHOW RESULT
          # -------------------------------------------------------

          echo ""
          echo "======================================"
          echo "CAPACITOR CONFIGURATION"
          echo "======================================"

          echo ""
          echo "--- settings.gradle ---"

          cat "$SETTINGS"

          echo ""
          echo "--- Capacitor dependency ---"

          grep -n "capacitor-android" "$APP_GRADLE" || true

          echo ""
          echo "--- Capacitor Android module ---"

          ls -la "$CAP_DIR/capacitor"

          echo ""
          echo "CAPACITOR ANDROID FIX: OK"


      # =========================================================
      # VERIFY CAPACITOR
      # =========================================================

      - name: Verify Capacitor Android
        shell: bash
        run: |
          set -e

          CAP_DIR="aurix-build/aurix-release/node_modules/@capacitor/android"

          test -d "$CAP_DIR"
          test -f "$CAP_DIR/capacitor/build.gradle"

          grep -q "include ':capacitor-android'" \
            aurix-build/aurix-release/android/settings.gradle

          grep -q "project(':capacitor-android')" \
            aurix-build/aurix-release/android/settings.gradle

          grep -q "implementation project(':capacitor-android')" \
            aurix-build/aurix-release/android/app/build.gradle

          echo ""
          echo "======================================"
          echo "CAPACITOR ANDROID: VERIFIED"
          echo "======================================"


      # =========================================================
      # JAVA 21
      # =========================================================

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo ""
          echo "Android SDK installed successfully."


      # =========================================================
      # GRADLE
      # =========================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"


      - name: Check Gradle
        shell: bash
        run: |
          gradle --version


      # =========================================================
      # BUILD APK
      # =========================================================

      - name: Build AURIX APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo ""
          echo "======================================"
          echo "BUILDING AURIX APK"
          echo "======================================"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug


      # =========================================================
      # FIND APK
      # =========================================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "Searching for APK..."

          APK=$(find \
            "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "ERROR: APK was not created."

            echo ""
            echo "Available build files:"

            find \
              "$ANDROID_DIR/app/build" \
              -type f \
              2>/dev/null \
              | sort \
              | head -300

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          ls -lh "$APK"

          mkdir -p output

          cp "$APK" output/AURIX.apk

          echo ""
          echo "Final APK:"
          ls -lh output/AURIX.apk


      # =========================================================
      # VERIFY APK
      # =========================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          test -s output/AURIX.apk

          echo ""
          echo "Verifying APK..."

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            output/AURIX.apk

          echo ""
          echo "======================================"
          echo "AURIX APK READY"
          echo "======================================"

          ls -lh output/AURIX.apk


      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload AURIX APK
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-APK
          path: output/AURIX.apk
          if-no-files-found: error
