name: Build AURIX APK

on:
  workflow_dispatch:

  push:
    paths:
      - "AURIX-Android-Release-v1-SDK-GRADLE-FIXED.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check AURIX ZIP
        shell: bash
        run: |
          set -e

          ZIP="AURIX-Android-Release-v1-SDK-GRADLE-FIXED.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: AURIX ZIP not found"
            ls -lah
            exit 1
          fi

          echo "AURIX ZIP found:"
          ls -lh "$ZIP"

      - name: Unpack AURIX
        shell: bash
        run: |
          set -e

          rm -rf aurix-build
          mkdir -p aurix-build

          unzip -q \
            "AURIX-Android-Release-v1-SDK-GRADLE-FIXED.zip" \
            -d aurix-build

          echo "Project structure:"
          find aurix-build -maxdepth 4 -type f | sort | head -300

      - name: Detect Android project
        shell: bash
        run: |
          set -e

          ANDROID_DIR=""

          if [ -f "aurix-build/aurix-release/android/settings.gradle" ]; then
            ANDROID_DIR="aurix-build/aurix-release/android"
          elif [ -f "aurix-build/android/settings.gradle" ]; then
            ANDROID_DIR="aurix-build/android"
          else
            echo "ERROR: Android project not found"
            find aurix-build \
              -name settings.gradle \
              -o -name settings.gradle.kts
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$ANDROID_DIR"

      - name: Check Android project
        shell: bash
        run: |
          set -e

          test -f "$ANDROID_DIR/settings.gradle"
          test -f "$ANDROID_DIR/build.gradle"
          test -f "$ANDROID_DIR/app/build.gradle"
          test -f "$ANDROID_DIR/app/src/main/AndroidManifest.xml"

          echo "Android project: OK"

      - name: Check AURIX web files
        shell: bash
        run: |
          set -e

          if [ -d "$ANDROID_DIR/../www" ]; then
            WEB_DIR="$ANDROID_DIR/../www"
          elif [ -d "aurix-build/aurix-release/www" ]; then
            WEB_DIR="aurix-build/aurix-release/www"
          else
            echo "WARNING: www directory not found"
            exit 0
          fi

          test -f "$WEB_DIR/index.html"
          test -f "$WEB_DIR/app.js"
          test -f "$WEB_DIR/styles.css"

          echo "AURIX web files: OK"

      # =========================================================
      # NODE + CAPACITOR
      # =========================================================

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Capacitor dependencies
        shell: bash
        run: |
          set -e

          cd aurix-build/aurix-release

          echo "Node version:"
          node --version

          echo "NPM version:"
          npm --version

          echo "Installing dependencies..."

          npm install \
            --no-audit \
            --no-fund

          echo "Dependencies installed"

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -e

          cd aurix-build/aurix-release

          echo "Running Capacitor sync..."

          npx cap sync android

          echo "Capacitor sync completed"

      - name: Verify Capacitor Android
        shell: bash
        run: |
          set -e

          CAP_DIR="aurix-build/aurix-release/node_modules/@capacitor/android"

          if [ ! -d "$CAP_DIR" ]; then
            echo "ERROR: @capacitor/android was not installed"
            exit 1
          fi

          echo "@capacitor/android found:"
          ls -lah "$CAP_DIR"

          echo ""
          echo "Capacitor Android Gradle files:"
          find "$CAP_DIR" \
            -maxdepth 3 \
            -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            | sort

      # =========================================================
      # JAVA
      # =========================================================

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK installed"

      # =========================================================
      # GRADLE
      # =========================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Check Gradle
        shell: bash
        run: |
          gradle --version

      # =========================================================
      # BUILD
      # =========================================================

      - name: Build AURIX APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "======================================"
          echo "BUILDING AURIX APK"
          echo "======================================"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      # =========================================================
      # FIND APK
      # =========================================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find \
            "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."

            echo ""
            echo "Available build files:"
            find \
              "$ANDROID_DIR/app/build" \
              -type f \
              2>/dev/null \
              | sort \
              | head -300

            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          mkdir -p output

          cp "$APK" output/AURIX.apk

          echo ""
          echo "Copied APK:"
          ls -lh output/AURIX.apk

      # =========================================================
      # VERIFY APK
      # =========================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          test -s output/AURIX.apk

          echo "Verifying APK..."

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            output/AURIX.apk

          echo ""
          echo "======================================"
          echo "AURIX APK READY"
          echo "======================================"

          ls -lh output/AURIX.apk

      # =========================================================
      # UPLOAD ARTIFACT
      # =========================================================

      - name: Upload AURIX APK
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-APK
          path: output/AURIX.apk
          if-no-files-found: error
